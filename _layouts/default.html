<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if page.title %}
            {{ page.title }} | {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <meta
        name="description"
        content="{{ site.description }}"
    >

    <meta name="theme-color" content="#0F172A">

    <!-- Prevent old cached CSS from causing inconsistent layouts -->
    <link
        rel="stylesheet"
        href="{{ '/assets/css/main.css' | relative_url }}"
    >

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@600&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="{{ '/assets/images/favicon.png' | relative_url }}"
    >
</head>

<body>

    {% include navbar.html %}

    <main>
        {{ content }}
    </main>

    {% include footer.html %}

    <script
        src="{{ '/assets/js/main.js' | relative_url }}"
        defer
    ></script>

    {% include cursor.html %}

</body>
</html>
